name: CI

on:
  push:
    branches: [ocaml-port]
  pull_request:
    branches: [ocaml-port]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.0"
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes

      # Four checks, in the order that makes a failure easiest to read.

      - name: Formatting
        run: opam exec -- dune build @fmt

      # The one that is a claim rather than a convention: `symbaroum` is the
      # domain core, and it has to build with no JavaScript runtime and no C
      # stubs in scope. The CLI lives in its own package precisely so that this
      # step keeps meaning something -- dune builds every stanza belonging to the
      # named package, so an executable left in `symbaroum` would have made this
      # green and vacuous.
      - name: Core builds without any UI or Unix dependency
        run: opam exec -- dune build -p symbaroum

      - name: Tests
        run: opam exec -- dune runtest

      - name: Everything, including the web bundle
        run: opam exec -- dune build --profile release

      - name: Bundle size
        run: |
          raw=$(stat -c%s _build/default/web/main.bc.js)
          gz=$(gzip -c _build/default/web/main.bc.js | wc -c)
          echo "main.bc.js: $((raw / 1024)) KB raw, $((gz / 1024)) KB gzipped" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the static site
        run: |
          mkdir -p site
          cp _build/default/web/main.bc.js \
             _build/default/web/index.html \
             _build/default/web/app.css \
             _build/default/web/index.css \
             site/

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  # Publishes to GitHub Pages. Deliberately separate from the build, and
  # deliberately not Vercel: the live Vercel URL tracks `master` and the React
  # app, and switching it over is a decision rather than a side effect of a
  # green build. See `vercel.json` and README for the one manual step if that is
  # what you want.
  #
  # Needs Pages enabled for the repository (Settings -> Pages -> Source:
  # GitHub Actions). Until it is, this job fails and the build job above does
  # not, which is the right way round.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/ocaml-port' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
